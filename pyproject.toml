[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "belief-search"
version = "0.1.0"
description = "Source-search simulation and plotting for independent Bayesian estimation work"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7", "Pillow>=9"]

[tool.setuptools.packages.find]
where = ["src"]
