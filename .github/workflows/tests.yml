name: Tests without optional data

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and dependencies
        run: python -m pip install -e .
      - name: Run tests and report passes and skips separately
        run: |
          python -B - <<'PY'
          import os
          from pathlib import Path
          import sys
          import unittest

          class ReportingResult(unittest.TextTestResult):
              passed = 0

              def addSuccess(self, test):
                  super().addSuccess(test)
                  self.passed += 1

          suite = unittest.defaultTestLoader.discover("tests")
          result = unittest.TextTestRunner(
              verbosity=2, resultclass=ReportingResult,
          ).run(suite)
          lines = [
              "## Belief-space test results",
              "",
              f"Discovered: {result.testsRun}; passed: {result.passed}; "
              f"skipped: {len(result.skipped)}; failures: {len(result.failures)}; "
              f"errors: {len(result.errors)}.",
              "",
              "Optional RadioMapSeer data is not downloaded in this job. "
              "Skipped tests do not validate the real dataset and are not counted as passes.",
              "",
          ]
          lines.extend(f"- `{test.id()}`: {reason}" for test, reason in result.skipped)
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(
              "\n".join(lines) + "\n", encoding="utf-8",
          )
          sys.exit(0 if result.wasSuccessful() else 1)
          PY
